[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-splunk-ao-e2e"
version = "0.1.0"
description = "Standalone banking demo for Agent Control evaluations emitted as Splunk Agent Observability control spans."
requires-python = ">=3.12,<3.15"
dependencies = [
  "splunk-ao[openai]>=0.1.1,<0.2.0",
  "agent-control-sdk[galileo,otel]>=8.4.0,<9.0.0",
  "httpx>=0.27.0,<0.29.0",
  "python-dotenv>=1.0",
  "streamlit>=1.36",
]

[tool.setuptools]
py-modules = [
  "banking_streamlit_app_splunk_ao",
  "banking_streamlit_app_otel_splunk_ao",
  "common_splunk_ao",
  "run_demo_splunk_ao",
  "run_demo_otel_splunk_ao",
  "setup_controls_splunk_ao",
]
